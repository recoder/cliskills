[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cliskill"
version = "0.1.0"
description = "A contract-first framework for agent-friendly CLI skills."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
demo-skill = "examples.demo_skill.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cliskill", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "examples", "tests"]
